name: probe
on:
  push:
    branches: [main]
    paths: [probe/probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py; curl -sS -o /dev/null -w "curl %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" https://playtomic.com/de/activities/tournaments/02f73bfa-6a3d-4a1e-b78e-77af447bac2f >> probe/result.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git pull -q --rebase || true
          git add probe/result.txt; git commit -m "probe result"; git push
