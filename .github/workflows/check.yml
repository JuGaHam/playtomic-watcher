name: Playtomic prüfen

on:
  # schedule:                # pausiert: Playtomic blockt GitHub-Server (HTTP 403)
  #   - cron: "*/5 * * * *"
  workflow_dispatch:         # manuell starten zum Testen
  push:                      # läuft auch sofort, wenn Events oder Skript geändert werden
    branches: [main]
    paths: [events.txt, check.py, .github/workflows/check.yml]

permissions:
  contents: write

concurrency:
  group: playtomic-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Events prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'padel-f2lf6vaiwkyt' }}
        run: python check.py

      - name: Zustand speichern
        run: |
          git config user.name "playtomic-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add state.json status.txt
          git diff --cached --quiet || git commit -m "Zustand aktualisiert"
          git push
